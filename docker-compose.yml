services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: creamo
      POSTGRES_USER: creamo
      POSTGRES_PASSWORD: creamo
      # 로컬 개발 전용: Windows + 한국어 로케일에서 SCRAM 비밀번호 인증 중 psycopg가 서버 에러
      # 메시지를 깨뜨리는 문제(UnicodeDecodeError)를 피하기 위해 로컬 연결은 비밀번호 없이 허용.
      POSTGRES_HOST_AUTH_METHOD: trust
    # 호스트에 포트를 굳이 열지 않는다 — 백엔드는 도커 내부망(서비스 이름으로 접속)만으로 충분하고,
    # 로컬 DB 확인도 `docker compose exec postgres psql`로 하면 되니 호스트 포트 노출이 필요 없다.
    # 예전엔 5432를 그대로 열어뒀는데, 비밀번호 없는 접속(POSTGRES_HOST_AUTH_METHOD: trust)과
    # 합쳐지면 배포 환경에서 보안 그룹 설정을 하나만 실수해도 DB가 인터넷에 그대로 열리는 구조라
    # 없앰(통합 테스트 중 발견) → ADR-040 참고.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: creamo
      POSTGRES_USER: creamo
      POSTGRES_PASSWORD: creamo
      # 컨테이너 네트워크 안에서는 서비스 이름이 곧 호스트명이 된다 (localhost 아님)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 루트 .env 파일(git에 안 올라감)에서 자동으로 읽어옴 → ADR-036 참고.
      PORTONE_STORE_ID: ${PORTONE_STORE_ID}
      PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      # 이메일 인증 발송용 SMTP(ADR-039 참고), 마찬가지로 .env에서 읽어옴.
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      # 배포 환경 전용 설정. 로컬 개발 기본값은 settings.py에 이미 들어있어서(localhost 등) .env에
      # 안 채워도 그대로 동작하고, 실제 배포할 때만 .env에 실제 값을 채우면 된다 → ADR-040 참고.
      SECRET_KEY: ${SECRET_KEY:-django-insecure-=lvlbt+q*t598z#wah)i(7um6hhmvt&#uk0rp63n0na@e!wbcd}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
